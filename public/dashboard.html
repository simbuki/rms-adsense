<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My dashboard — RMS AdSense</title>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div id="nav-root"></div>

<header class="page-head">
  <div class="wrap page-head-row">
    <div>
      <div class="eyebrow">My dashboard</div>
      <h1 class="page-title" id="welcome"></h1>
      <p class="lede">Track booking requests, approvals and invoices in one place.</p>
    </div>
    <a href="browse.html" class="btn btn-signal">Browse more slots →</a>
  </div>
</header>

<main id="main" class="wrap page-body">

  <div class="grid-stats" style="margin-bottom: 28px;">
    <div class="card" style="border-top-color: var(--pending);"><div class="stat-value" id="stat-pending" style="color:var(--pending);"></div><div class="stat-caption">Pending review</div></div>
    <div class="card" style="border-top-color: var(--open);"><div class="stat-value" id="stat-approved" style="color:var(--open);"></div><div class="stat-caption">Approved</div></div>
    <div class="card" style="border-top-color: var(--paper);"><div class="stat-value" id="stat-unpaid"></div><div class="stat-caption">Awaiting payment</div></div>
  </div>

  <h2 class="block-title">My bookings</h2>
  <div id="bookings-root" style="display:flex; flex-direction:column; gap:12px;"></div>

  <div style="margin-top: 32px;">
    <a href="browse.html" class="btn btn-dark">Browse more slots →</a>
  </div>
</main>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/config.js?v=20260930"></script>
<script src="assets/app-data.js?v=20260930"></script>
<script>
  async function init() {
    const session = await requireRole("client");
    if (!session) return;

    renderNav("dashboard");
    renderFooter("footer-root");

    document.getElementById("welcome").textContent = `Welcome back, ${session.name}.`;

    await getStations();
    await getSlots();

    // RLS already scopes these to the current client's own rows.
    const bookings = await getBookings();
    const invoices = await getInvoices();

    const pendingCount = bookings.filter((b) => b.status === "pending").length;
    const approvedCount = bookings.filter((b) => b.status === "approved").length;
    const unpaidCount = invoices.filter((inv) => inv.paymentStatus === "unpaid").length;

    document.getElementById("stat-pending").textContent = pendingCount;
    document.getElementById("stat-approved").textContent = approvedCount;
    document.getElementById("stat-unpaid").textContent = unpaidCount;

    const root = document.getElementById("bookings-root");
    if (bookings.length === 0) {
      root.innerHTML = `<div class="empty">No bookings yet — <a href="browse.html">browse available slots</a> to get started.</div>`;
      return;
    }

    root.innerHTML = bookings.map((b) => {
      const slot = slotById(b.slotId);
      const station = slot ? stationById(slot.station_id) : null;
      const invoice = invoices.find((inv) => inv.bookingId === b.id);
      let action = "";
      if (b.status === "approved" && invoice && invoice.paymentStatus === "unpaid") {
        action = `<a href="payment.html?invoice=${invoice.id}" class="btn btn-signal btn-sm">Pay ${KES(invoice.amount)} →</a>`;
      } else if (invoice && invoice.paymentStatus === "paid") {
        action = `<span class="badge badge-paid">Paid</span>`;
      }
      return `
      <div class="card row-card">
        <div>
          <div class="slot-title" style="font-size:17px;">${slot ? escapeHtml(slot.label) : "Slot no longer available"}</div>
          <div style="font-size:13px; color:var(--ink-60);">${station ? escapeHtml(station.name) + " · " : ""}${slot ? escapeHtml(slot.day) + " " + escapeHtml(slot.time) : ""} · submitted ${b.submittedAt}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          ${badgeHtml(b.status)}
          ${action}
        </div>
      </div>`;
    }).join("");
  }

  init();
</script>
<script src="assets/voiceflow.js" defer></script>
</body>
</html>
