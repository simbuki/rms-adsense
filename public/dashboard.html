<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My dashboard — RMS AdSense</title>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div id="nav-root"></div>

<div class="wrap" style="padding-top: 28px; padding-bottom: 64px;">
  <div class="eyebrow" style="color: var(--ink-40);">My dashboard</div>
  <h1 class="f-display" id="welcome" style="font-size: 30px; font-weight: 700; margin: 0 0 20px;"></h1>

  <div class="grid-stats" style="margin-bottom: 28px;">
    <div class="card"><div class="f-display" id="stat-pending" style="font-size:28px; font-weight:700; color:var(--pending);"></div><div style="font-size:12.5px; color:var(--ink-60);">Pending review</div></div>
    <div class="card"><div class="f-display" id="stat-approved" style="font-size:28px; font-weight:700; color:var(--open);"></div><div style="font-size:12.5px; color:var(--ink-60);">Approved</div></div>
    <div class="card"><div class="f-display" id="stat-unpaid" style="font-size:28px; font-weight:700; color:var(--signal);"></div><div style="font-size:12.5px; color:var(--ink-60);">Awaiting payment</div></div>
  </div>

  <div class="f-display" style="font-size: 20px; font-weight: 700; margin-bottom: 14px;">My bookings</div>
  <div id="bookings-root" style="display:flex; flex-direction:column; gap:12px;"></div>

  <div style="margin-top: 32px;">
    <a href="browse.html" class="btn btn-dark">Browse more slots →</a>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app-data.js"></script>
<script>
  async function init() {
    const session = await requireRole("client");
    if (!session) return;

    renderNav("dashboard");
    renderFooter("footer-root");

    document.getElementById("welcome").textContent = `Welcome back, ${session.name}.`;

    await getStations();
    await getSlots();

    // RLS already scopes these to the current client's own rows.
    const bookings = await getBookings();
    const invoices = await getInvoices();

    const pendingCount = bookings.filter((b) => b.status === "pending").length;
    const approvedCount = bookings.filter((b) => b.status === "approved").length;
    const unpaidCount = invoices.filter((inv) => inv.paymentStatus === "unpaid").length;

    document.getElementById("stat-pending").textContent = pendingCount;
    document.getElementById("stat-approved").textContent = approvedCount;
    document.getElementById("stat-unpaid").textContent = unpaidCount;

    const root = document.getElementById("bookings-root");
    if (bookings.length === 0) {
      root.innerHTML = `<div class="empty">No bookings yet — <a href="browse.html" style="color:var(--signal); font-weight:600;">browse available slots</a> to get started.</div>`;
      return;
    }

    root.innerHTML = bookings.map((b) => {
      const slot = slotById(b.slotId);
      const station = slot ? stationById(slot.station_id) : null;
      const invoice = invoices.find((inv) => inv.bookingId === b.id);
      let action = "";
      if (b.status === "approved" && invoice && invoice.paymentStatus === "unpaid") {
        action = `<a href="payment.html?invoice=${invoice.id}" class="btn btn-signal btn-sm">Pay ${KES(invoice.amount)} →</a>`;
      } else if (invoice && invoice.paymentStatus === "paid") {
        action = `<span class="badge badge-paid">Paid</span>`;
      }
      return `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div>
          <div class="f-display" style="font-weight:700; font-size:16px;">${slot ? escapeHtml(slot.label) : "Slot no longer available"}</div>
          <div style="font-size:13px; color:var(--ink-60);">${station ? escapeHtml(station.name) + " · " : ""}${slot ? escapeHtml(slot.day) + " " + escapeHtml(slot.time) : ""} · submitted ${b.submittedAt}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          ${badgeHtml(b.status)}
          ${action}
        </div>
      </div>`;
    }).join("");
  }

  init();
</script>
</body>
</html>
