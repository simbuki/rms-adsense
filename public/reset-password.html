<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — RMS AdSense</title>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div id="nav-root"></div>

<div class="wrap" style="max-width: 440px; padding-top: 56px; padding-bottom: 64px;">
  <h1 class="f-display" style="font-size: 28px; font-weight: 700; margin: 0 0 6px;">Set a new password.</h1>
  <p style="color: var(--ink-60); font-size: 14.5px; margin: 0 0 22px;" id="subtitle">
    Choose a new password for your account.
  </p>

  <div id="content-root"></div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app-data.js"></script>
<script>
  const content = document.getElementById("content-root");

  function renderForm() {
    content.innerHTML = `
      <form id="reset-form" class="card" style="padding: 24px;">
        <div class="field"><label for="new-password">New password</label><input id="new-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" /></div>
        <div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" placeholder="Re-enter the password" autocomplete="new-password" /></div>
        <div id="reset-error"></div>
        <button type="submit" class="btn btn-signal btn-block" id="reset-submit">Update password →</button>
      </form>`;

    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorRoot = document.getElementById("reset-error");
      const btn = document.getElementById("reset-submit");
      const pw = document.getElementById("new-password").value;
      const confirm = document.getElementById("confirm-password").value;

      errorRoot.innerHTML = "";
      if (pw.length < 8) {
        errorRoot.innerHTML = `<div class="error-box">Password must be at least 8 characters.</div>`;
        return;
      }
      if (pw !== confirm) {
        errorRoot.innerHTML = `<div class="error-box">Passwords don't match.</div>`;
        return;
      }

      btn.disabled = true;
      btn.textContent = "Updating…";
      try {
        const result = await updatePassword(pw);
        if (result.error) {
          errorRoot.innerHTML = `<div class="error-box">${result.error}</div>`;
          btn.disabled = false;
          btn.textContent = "Update password →";
          return;
        }
        await sb.auth.signOut();
        content.innerHTML = `
          <div class="success-box" style="margin-bottom: 16px;">Password updated. Log in with your new password.</div>
          <a href="login.html" class="btn btn-dark btn-block">Go to log in →</a>`;
      } catch (err) {
        errorRoot.innerHTML = `<div class="error-box">${err.message || "Something went wrong."}</div>`;
        btn.disabled = false;
        btn.textContent = "Update password →";
      }
    });
  }

  async function init() {
    renderNav("login");
    renderFooter("footer-root");

    // supabase-js parses the recovery token from the URL on load and
    // establishes a temporary session automatically (detectSessionInUrl
    // is on by default). If that didn't happen — link expired, already
    // used, or opened directly without a token — there's no session.
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      document.getElementById("subtitle").textContent =
        "This reset link is invalid or has expired.";
      content.innerHTML = `
        <div class="error-box" style="margin-bottom: 16px;">
          Request a new reset link from the login page.
        </div>
        <a href="login.html" class="btn btn-dark btn-block">Back to log in →</a>`;
      return;
    }

    renderForm();
  }

  init();
</script>
</body>
</html>
